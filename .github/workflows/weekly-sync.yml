name: Weekly Song Bank Sync

on:
  schedule:
    # Monday 12:00 PM Central (CDT, UTC-5). GitHub Actions cron is
    # always UTC and does not adjust for daylight saving time — this
    # will fire at 11:00 AM Central instead once DST ends (~early
    # November) and Central shifts to CST (UTC-6). Change 17 to 18 then
    # if you want it to stay at true noon; otherwise the hour of drift
    # doesn't affect correctness, just timing.
    - cron: "0 17 * * 1"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional exclusive start date (YYYY-MM-DD); defaults to 90 days ago"
        required: false
        type: string
      end_date:
        description: "Optional inclusive end date (YYYY-MM-DD); defaults to today"
        required: false
        type: string

concurrency:
  group: weekly-song-bank-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for the heartbeat commit step to push back
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > service_account.json

      - name: Run sync
        env:
          PCO_CLIENT_ID: ${{ secrets.PCO_CLIENT_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
          PCO_SERVICE_TYPE_ID: ${{ secrets.PCO_SERVICE_TYPE_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          start_date="${START_DATE:-$(date -u -d '90 days ago' +%F)}"
          end_date="${END_DATE:-$(date -u +%F)}"
          echo "Catching up plans after ${start_date} through ${end_date}"
          python backfill.py --start "$start_date" --end "$end_date"

      # These steps keep the scheduled workflow active even if the sync
      # fails. The heartbeat goes to a dedicated, unprotected branch:
      # pushing directly to protected main was rejected and made every
      # otherwise-successful sync appear to fail.

      - name: Record run timestamp
        if: always()
        run: date -u +"%Y-%m-%d %H:%M:%S UTC" > last_run.txt

      - name: Commit heartbeat file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git diff --staged --quiet || git commit -m "chore: automated sync heartbeat"
          git push --force origin HEAD:refs/heads/automation-heartbeat
